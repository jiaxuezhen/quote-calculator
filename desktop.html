<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多产品报价计算器 · Custom Packaging</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--green:#16a34a;--danger:#dc2626;--navy:#17365d;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px} h1{font-size:22px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:minmax(330px,.9fr) minmax(430px,1.35fr);gap:16px} @media(max-width:850px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)} .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:700;letter-spacing:.4px}
label{display:block;font-size:13px;font-weight:600;margin:11px 0 4px} select,input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.row{display:flex;gap:10px} .row>div{flex:1} .hint{font-size:12px;color:var(--muted);margin-top:6px} .badge{display:inline-block;padding:2px 8px;border-radius:20px;background:#eef2ff;color:#3730a3;font-size:11px}
.addon{margin:6px 0;font-size:13px} .addon label{display:flex;align-items:center;gap:8px;font-weight:500;margin:0} .addon input{width:auto}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer} .btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:14px} .btn-danger{background:#fee2e2;color:#991b1b;padding:6px 9px} .btn-ghost{background:#eef2ff;color:#1e40af}
.summary{background:linear-gradient(135deg,#17365d,#2563eb);color:white;border:none} .summary h2{color:#dbeafe}
.line{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.18);font-size:14px} .line:last-child{border:0} .total{font-size:25px;font-weight:800} .total .v{color:#fbbf24}
.items{width:100%;border-collapse:collapse;font-size:12.5px} .items th{text-align:left;background:#f8fafc;padding:8px;border-bottom:1px solid var(--line)} .items td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top} .items .money{text-align:right;white-space:nowrap}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px}
.shipbox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)} .warn{font-size:12px;color:#b45309;margin-top:8px}
.dbwrap{margin-top:16px} #dbTable{width:100%;border-collapse:collapse;font-size:12px} #dbTable th{position:sticky;top:0;background:#17365d;color:#fff;padding:7px 8px;text-align:left;white-space:nowrap} #dbTable td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap} #dbTable tr:nth-child(even) td{background:#fafbfc}
.logistics-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
.logistics-grid input,.logistics-grid select,.shipbox .row>div{min-width:0}
.freight-source{margin-top:10px;padding:10px 12px;border:1px solid #bae6fd;border-radius:8px;background:#f0f9ff;color:#0c4a6e;font-size:12px}
.freight-source strong{display:block;margin-bottom:2px}
.summary .v{text-align:right;overflow-wrap:anywhere}
@media(max-width:520px){.logistics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.weight-lookup{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}.weight-lookup .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr))}.weight-lookup output{display:block}
.smallrule{color:#1d4ed8;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>多产品报价计算器 · 定制包装</h1>
  <p class="sub">选择产品、规格和数量，加入报价单后即可计算美元总价并复制报价摘要。</p>

  <div class="grid">
    <div>
      <div class="card">
        <h2>① 添加产品</h2>
        <label>产品品类</label><select id="product"></select>
        <label>尺寸 / 规格</label><select id="size"></select>
        <div class="hint" id="sizeHint"></div>
        <label>数量</label><div id="qtyWrap"></div>
        <div class="hint" id="priceHint"></div>
        <div class="hint" id="productWeightHint" aria-live="polite"></div>
        <div id="addonsBox" style="margin-top:12px"></div>
        <button class="btn btn-primary" id="addBtn">＋ Add Product / 添加到报价单</button>
      </div>

      <div class="card shipbox">
        <h2>② 包装与物流</h2>
        <div class="hint">运费按整单估算。填了外箱数据时，按毛重和体积重取大。已有承运商报价时，可选择「手动输入」。</div>
        <div class="logistics-grid">
          <div><label for="destination">目的地国家</label><input id="destination" list="destinationOptions" value="美国" autocomplete="off"></div>
          <datalist id="destinationOptions"><option value="美国"><option value="加拿大"><option value="英国"><option value="澳大利亚"><option value="新加坡"><option value="阿联酋"></datalist>
          <div><label for="zip">目的地邮编</label><input id="zip" placeholder="如 10001" autocomplete="off"></div>
          <div><label for="zipPrefix">美国 ZIP 首位</label><input id="zipPrefix" inputmode="numeric" maxlength="1" placeholder="如 9"></div>
          <div><label for="packageLength">外箱长 cm</label><input id="packageLength" type="number" min="0.01" step="any"></div>
          <div><label for="packageWidth">外箱宽 cm</label><input id="packageWidth" type="number" min="0.01" step="any"></div>
          <div><label for="packageHeight">外箱高 cm</label><input id="packageHeight" type="number" min="0.01" step="any"></div>
          <div><label for="packageWeight">单箱毛重 kg</label><input id="packageWeight" type="number" min="0.01" step="any"></div>
          <div><label for="packageCount">相同外箱箱数</label><input id="packageCount" type="number" min="1" step="1" value="1"></div>
          <div><label for="billableWeight">计费重量 kg</label><input id="billableWeight" type="number" min="0.01" step="any" placeholder="可按货代数据修正"></div>
        </div>
        <div class="hint" id="packageInfo"></div>
        <div class="row">
          <div><label for="shipMode">运输方式</label>
            <select id="shipMode">
              <option value="none">暂不计运费</option>
              <option value="air">原产品库空运估算</option>
              <option value="sea">原产品库海运估算</option>
              <option value="us_fedex_standard">美国 FedEx 普货包税（0.5-12kg）</option>
              <option value="us_fedex_express">美国 FedEx 特快包税（0.5-20kg）</option>
              <option value="us_air_heavy">美国空派重货包税（12kg+）</option>
              <option value="us_sea_clx">美国海派 CLX（12kg+）</option>
              <option value="us_sea_max">美国海派 MAX（12kg+）</option>
              <option value="us_sea_exx">美国海派 EXX（12kg+）</option>
              <option value="us_sea_hede">美国海派合德（12kg+）</option>
              <option value="us_sea_standard">美国海派普船（12kg+）</option>
              <option value="manual">手动输入</option>
            </select>
          </div>
          <div><label for="shipping">运费 USD</label><input type="number" id="shipping" min="0" step="0.01" value="0"></div>
        </div>
        <div class="logistics-grid">
          <div><label for="exchangeRate">汇率（1 USD = RMB）</label><input type="number" id="exchangeRate" min="0.01" step="0.01" value="7.20"></div>
        </div>
        <div class="hint" id="weightInfo"></div>
        <div class="warn" id="weightWarn"></div>
        <div class="freight-source" id="freightSource" role="status"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>③ 当前报价单产品</h2>
        <div id="cartEmpty" class="empty">还没有产品，左侧选择产品后点击“添加到报价单”。</div>
        <div style="overflow:auto"><table class="items" id="cartTable" style="display:none">
          <thead><tr><th>#</th><th>产品</th><th>规格</th><th>Qty</th><th class="money">货值</th><th class="money">工艺</th><th></th></tr></thead>
          <tbody id="cartBody"></tbody>
        </table></div>
      </div>

      <div class="card summary" style="margin-top:16px">
        <h2>报价汇总</h2>
        <div class="line"><span>产品种类</span><span class="v" id="rCount">0</span></div>
        <div class="line"><span>产品货值</span><span class="v" id="rItems">$0.00</span></div>
        <div class="line"><span>工艺附加费</span><span class="v" id="rAddons">$0.00</span></div>
        <div class="line"><span>整单运费</span><span class="v" id="rShipping">$0.00</span></div>
        <div class="line total"><span>Total</span><span class="v" id="rTotal">$0.00</span></div>
        <button type="button" id="copyQuoteBtn" class="btn btn-primary">复制报价摘要</button>
        <div class="hint" id="copyStatus" role="status" style="color:#dbeafe"></div>
      </div>
    </div>
  </div>

  <div class="card dbwrap">
    <h2>📋 完整报价数据库</h2>
    <div class="weight-lookup">
      <strong>按尺寸和数量估重</strong>
      <div class="row">
        <div><label for="weightProduct">产品品类</label><select id="weightProduct"></select></div>
        <div><label for="weightSize">尺寸 / 规格</label><input id="weightSize" list="weightSizeOptions" placeholder="例如 16×7×13"><datalist id="weightSizeOptions"></datalist></div>
        <div><label for="weightQty">数量</label><input id="weightQty" type="number" min="1" step="1" placeholder="例如 75"></div>
      </div>
      <output class="hint" id="dbWeightEstimate" aria-live="polite">选择品类，填写尺寸和数量后查看重量。</output>
      <p class="hint">报价库重量供估算。正式运费以实际装箱毛重和承运商的体积重规则为准。</p>
    </div>
    <div class="row">
      <div><label>筛选品类</label><select id="dbProduct"></select></div>
      <div><label>搜索尺寸 / 袋型 / 用途</label><input id="dbSearch" type="text" placeholder="如 25×20×7 / 横版 / T恤"></div>
    </div>
    <div class="hint" id="dbCount" style="margin:8px 0"></div>
    <div style="overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px"><table id="dbTable"></table></div>
  </div>
</div>

const weightKg = kg => Number(kg.toFixed(3));
const normalizeWeightSize = value => value.normalize('NFKC').toLowerCase().replace(/[×*]/g, 'x')

function estimateCatalogWeight(product, size, count) {
  if (!Number.isSafeInteger(count) || count < 1) return null;
  const byQuantity = new Map();
  for (const row of DB_ROWS) {
    if (row.Product !== product.name || row.Type !== size.type || row.cm !== size.cm) continue;
    const match = String(row.weight || '').match(/^([\d.]+)\s*kg(?:\s*\/\s*(\d+)\s*pcs)?$/i);
    if (!match) continue;
    const kg = Number(match[1]);
    const qty = Number(match[2] || row.qty);
    if (!Number.isFinite(kg) || kg <= 0 || !Number.isSafeInteger(qty) || qty < 1) continue;
    const prior = byQuantity.get(qty);
    if (!prior || row.src === 'Original') byQuantity.set(qty, {qty, kg, ref: row.src === 'Reference' ? row.ref : ''});
  }
  const label = point => `${point.qty} 个 ${weightKg(point.kg)} kg${point.ref ? `（原表参考 ${point.ref}）` : ''}`;
  const exact = byQuantity.get(count);
  if (exact) return {kg: exact.kg, detail: `报价库记录 ${label(exact)}`};
  const sorted = [...byQuantity.values()].sort((a, b) => a.qty - b.qty);
  const upperIndex = sorted.findIndex(point => point.qty > count);
  if (upperIndex > 0) {
    const lower = sorted[upperIndex - 1];
    const upper = sorted[upperIndex];
    const kg = lower.kg + (upper.kg - lower.kg) * (count - lower.qty) / (upper.qty - lower.qty);
    return {kg, detail: `按 ${label(lower)} 和 ${label(upper)} 两档插值`};
  }
  const anchor = upperIndex === 0 ? sorted[0] : sorted.at(-1);
  if (!anchor) return null;
  const kg = anchor.kg / anchor.qty * count;
  return {kg, detail: `按同规格 ${label(anchor)} 等比例估算`};
}

function matchingWeightSizes(product, dimension) {
  const query = normalizeWeightSize(dimension);
  const labelMatch = product.sizes.find(spec => normalizeWeightSize(spec.label) === query);
  return labelMatch ? [labelMatch] : product.sizes.filter(spec => normalizeWeightSize(spec.cm) === query);
}

  if(!p||!s) return null;
  const qty=Number($('qty').value);
  if (!Number.isSafeInteger(qty) || qty < (s.mode === 'unit' ? s.moq || 1 : 1)) return null;
  let bmin=0,bmax=0,src='',notes='';
  if(s.mode==='unit'){
    bmin=(s.unitMin||0)*qty; bmax=(s.unitMax||s.unitMin||0)*qty; src='Original';
  } else {
    const t=s.tiers.find(x=>x.qty===qty);
    if(!t) return null;
    bmin=t.bmin; bmax=t.bmax; src=t.src; notes=t.notes;
  }
  const price=(bmin+bmax)/2;
  const addonChecks=[...document.querySelectorAll('.addonCheck:checked')];
  let addon=0, quoteAddons=[];
  addonChecks.forEach(c=>{
    const a=p.addons[parseInt(c.dataset.i)];
    if(a.quote) quoteAddons.push(a.label); else addon+=Number(a.price||0)*(a.perUnit?qty:1);
  });
  const estimate = estimateCatalogWeight(p, s, qty);
  return {productId:p.id,product:p.name,size:s.label,qty,bmin,bmax,price,addon,quoteAddons,src,
    weight:estimate?.kg ?? null, weightDetail:estimate?.detail || '', notes};
}

function previewPrice(){
  const x=getSelection();
  $('addBtn').disabled = !x;
  $('productWeightHint').textContent = !x ? '' : x.weight == null
    ? '该规格暂无报价库重量记录。'
    : `参考重量 ${weightKg(x.weight)} kg · ${x.weightDetail}`;
  if (!x) { $('priceHint').textContent = '请输入有效数量，并满足该规格的起订量。'; return; }
  const range=x.bmin!==x.bmax?` · 区间 ${fmt(x.bmin)}–${fmt(x.bmax)}，当前取中值`:'';
  const source=x.src==='SmallQtyRule'?' · 小批量规则':'';
  $('priceHint').textContent=`货值 ${fmt(x.price)} · 单价 ${(x.price/x.qty).toFixed(3)}${range}${source}`;
}

$('addBtn').onclick=()=>{
  const x=getSelection(); if(!x) return;
  cart.push(x); renderCart();
};

function renderCart(){
  $('cartEmpty').style.display=cart.length?'none':'block';
  $('cartTable').style.display=cart.length?'table':'none';
  $('cartBody').innerHTML=cart.map((x,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${x.product}${x.src==='SmallQtyRule'?'<div class="smallrule">SmallQtyRule</div>':''}</td>
      <td>${x.size}${x.quoteAddons.length?'<div class="hint">需另报：'+x.quoteAddons.join(' / ')+'</div>':''}</td>
      <td>${x.qty}</td>
      <td class="money">${fmt(x.price)}</td>
      <td class="money">${fmt(x.addon)}</td>
      <td><button class="btn btn-danger" onclick="removeItem(${i})">删除</button></td>
    </tr>`).join('');
  updateSummary();
}

function removeItem(i){ cart.splice(i,1); renderCart(); }

function orderWeight(){
  let total=0, missing=0;
  cart.forEach(x=>{ if(Number.isFinite(x.weight)) total+=x.weight; else missing++; });
  return {total:Math.round(total*10)/10,missing};
}
function shipEstimate(mode,w){
  if(mode==='air') return Math.round(FREIGHT_MODEL.air*w);
  if(mode==='sea') return Math.round(FREIGHT_MODEL.seaBase+FREIGHT_MODEL.seaKg*w);
  return 0;
}
function usRegion(){
  const fullZip = $('zip').value.trim();
  const digit = fullZip ? (/^\d{5}(?:-\d{4})?$/.test(fullZip) ? fullZip[0] : '') : $('zipPrefix').value.trim();
  if(/^[89]$/.test(digit))return {key:'west',label:'美国西部'};
  if(/^[4-7]$/.test(digit))return {key:'central',label:'美国中部'};
  if(/^[0-3]$/.test(digit))return {key:'east',label:'美国东部'};
  return null;
}
function halfKgRate(table,weight,maxWeight){
  if(!(weight>0&&weight<=maxWeight))return null;
  const rounded=Math.ceil(weight*2)/2;
  return {rmb:table[Math.round(rounded*2)-1],rounded};
}
function usFreightEstimate(mode,weight){
  const exchange=Number($('exchangeRate').value);
  if(!Number.isFinite(exchange)||!(exchange>0))return {error:'请填写有效的人民币兑美元汇率。'};
  if(mode==='us_fedex_standard'){
    const rate=halfKgRate(US_FREIGHT.fedexStandard,weight,12);
    if(!rate)return {error:'FedEx 普货包税只适用于 0.5-12kg。'};
    return {usd:rate.rmb/exchange,rmb:rate.rmb,detail:`按 ${rate.rounded}kg 档位；美国本土48州；约 9-14 个自然日`};
  }
  if(mode==='us_fedex_express'){
    const rate=halfKgRate(US_FREIGHT.fedexExpress,weight,20);
    if(!rate)return {error:'FedEx 特快包税只适用于 0.5-20kg。'};
    return {usd:rate.rmb/exchange,rmb:rate.rmb,detail:`按 ${rate.rounded}kg 档位；美国本土48州；约 6-10 个自然日`};
  }
  const region=usRegion();
  if(!region)return {error:'请输入有效的美国邮编，或留空邮编并填写 ZIP 首位。'};
  if(mode==='us_air_heavy'){
    if(!(weight>=12&&weight<=1000))return {error:'美国空派重货费率适用于 12-1000kg。'};
    const band=weight<=21?0:weight<=70?1:weight<=100?2:3;
    const unit=US_FREIGHT.airHeavy[region.key][band];
    const rmb=weight*unit;
    return {usd:rmb/exchange,rmb,detail:`${region.label}，RMB ${unit}/kg；住宅、偏远、超重超尺寸等附加费未计`};
  }
  const sea=US_FREIGHT.sea[mode];
  if(sea){
    if(weight<12)return {error:'美国海派重货最低按 12kg 计费，请确认计费重量。'};
    const band=weight<=50?0:weight<=100?1:2;
    const unit=sea[region.key][band];
    const rmb=weight*unit;
    return {usd:rmb/exchange,rmb,detail:`${sea.label} · ${region.label} · RMB ${unit}/kg；${sea.days}；附加费未计`};
  }
  return null;
}
const packageFields = ['packageLength', 'packageWidth', 'packageHeight', 'packageWeight', 'packageCount'];

function packageWeights() {
  const raw = packageFields.map(id => $(id).value);
  if (!raw.slice(0, 4).some(Boolean) && raw[4] === '1') return null;
  const [length, width, height, gross, count] = raw.map(Number);
  if (![length, width, height, gross].every(value => Number.isFinite(value) && value > 0)
      || !Number.isSafeInteger(count) || count < 1) {
    return {error: '请填写完整的外箱长、宽、高、单箱毛重和箱数。'};
  }
  const grossTotal = gross * count;
  const volumeTotal = length * width * height * count / 6000;
  if (!Number.isFinite(grossTotal) || !Number.isFinite(volumeTotal)) return {error: '装箱数据超出计算范围。'};
  return {grossTotal, volumeTotal, charge: Math.max(grossTotal, volumeTotal)};
}

function currentWeightBasis() {
  return JSON.stringify([cart, ...packageFields.map(id => $(id).value)]);
}

function currentManualBasis() {
  return JSON.stringify([currentWeightBasis(), ...['destination','zip','zipPrefix','billableWeight','exchangeRate'].map(id => $(id).value.trim())]);
}

function setFreightSource(title, detail) {
  const heading = document.createElement('strong');
  heading.textContent = `费率来源 · ${title}`;
  $('freightSource').replaceChildren(heading, detail);
}

function updateShipping(){
  const {total, missing} = orderWeight();
  const packaging = packageWeights();
  const manualWeight = Number($('billableWeight').value);
  const hasManualWeight = Number.isFinite(manualWeight) && manualWeight > 0;
  const chargeWeight = hasManualWeight ? manualWeight : packaging?.charge ?? (missing ? 0 : total);
  const mode = $('shipMode').value;
  const usMode = mode.startsWith('us_');
  const estimateMode = usMode || mode === 'air' || mode === 'sea';
  const isUS = /^(美国|us|usa|united states)$/i.test($('destination').value.trim());
  const roundKg = kg => Number(kg.toFixed(2));
  $('packageInfo').textContent = packaging?.error || (packaging
    ? `外箱总毛重 ${roundKg(packaging.grossTotal)} kg · 总体积重 ${roundKg(packaging.volumeTotal)} kg（÷6000）` : '');
  $('weightInfo').textContent = `商品库可计算重量 ${total} kg · 计费重量 ${chargeWeight > 0 ? roundKg(chargeWeight) + ' kg' : '待确认'}${hasManualWeight ? '（手动）' : ''}`;
  $('weightWarn').textContent = missing && !hasManualWeight && !packaging?.charge
    ? `有 ${missing} 项产品缺少重量数据，请填写整单计费重量或外箱数据。` : '';
  $('shipping').readOnly = mode !== 'manual';
  if (mode !== 'manual') $('shipping').value = '';
  freightIssue = '';
  let source = '运费未计入报价。';
  if (estimateMode && !hasManualWeight && ($('billableWeight').validity.badInput || $('billableWeight').value)) {
    freightIssue = '请填写有效的计费重量。';
  } else if (estimateMode && !hasManualWeight && packaging?.error) {
    freightIssue = packaging.error;
  } else if (estimateMode && !(chargeWeight > 0)) {
    freightIssue = '请先填写完整整单计费重量。';
  } else if (usMode && !isUS) {
    freightIssue = '美国参考费率仅适用于美国目的地。';
  } else if (usMode) {
    const estimate = usFreightEstimate(mode, chargeWeight);
    if (estimate?.error) freightIssue = estimate.error;
    else {
      $('shipping').value = estimate.usd.toFixed(2);
      source = `${estimate.detail}。参考运费 CNY ${estimate.rmb.toFixed(2)}，按汇率 ${Number($('exchangeRate').value).toFixed(2)} 换算，实际费用以货代确认为准。`;
    }
  } else if (estimateMode) {
    $('shipping').value = shipEstimate(mode, chargeWeight);
    source = '原产品库美元估算，实际费用以货代确认为准。';
  } else if (mode === 'manual') {
    const value = $('shipping').value;
    if (manualBasis !== null && manualBasis !== currentManualBasis()) {
      $('shipping').value = '';
      freightIssue = '报价条件已变更，请重新录入运费。';
    } else if (value === '' || !Number.isFinite(Number(value)) || Number(value) < 0) {
      freightIssue = '请录入本次条件下的运费。';
    }
    source = '手工录入运费，以货代最终账单为准。';
  } else {
    $('shipping').value = '0';
  }
  setFreightSource(usMode ? US_FREIGHT.source : '报价系统', freightIssue || source);
}

$('shipMode').onchange = () => {
  $('shipping').value = '';
  manualBasis = null;
  updateSummary();
};
$('shipping').oninput = () => {
  if ($('shipMode').value === 'manual') manualBasis = currentManualBasis();
  updateSummary();
};
$('billableWeight').oninput = () => {
  weightBasis = currentWeightBasis();
  updateSummary();
};
$('zipPrefix').oninput = () => {
  $('zipPrefix').value = $('zipPrefix').value.replace(/\D/g, '').slice(0, 1);
  updateSummary();
};
for (const id of ['destination', 'zip', 'exchangeRate', ...packageFields]) {
  $(id).addEventListener('input', () => {
    if (id === 'destination') {
      $('zip').value = '';
      $('zipPrefix').value = '';
    }
    updateSummary();
  });
}

function quoteProblem() {
  return freightIssue || (cart.some(item => item.quoteAddons.length) ? '工艺费用待确认。' : '');
}

function updateSummary(){
  $('copyStatus').textContent = '';
  if ($('billableWeight').value && weightBasis !== currentWeightBasis()) {
    $('billableWeight').value = '';
    weightBasis = null;
  }
  updateShipping();
  const items = cart.reduce((sum, item) => sum + item.price, 0);
  const addons = cart.reduce((sum, item) => sum + item.addon, 0);
  const shipping = Number($('shipping').value) || 0;
  $('rCount').textContent = cart.length;
  $('rItems').textContent = fmt(items);
  $('rAddons').textContent = fmt(addons);
  $('rShipping').textContent = freightIssue ? '待确认' : $('shipMode').value === 'none' ? '未计' : fmt(shipping);
  $('rTotal').textContent = quoteProblem() || fmt(items + addons + shipping);
}

$('copyQuoteBtn').onclick = async () => {
  const problem = !cart.length ? '请先添加产品。' : quoteProblem();
  if (problem) { $('copyStatus').textContent = problem; return; }
  const lines = cart.map(item => `${item.product} | ${item.size} | ${item.qty} pcs | ${fmt(item.price + item.addon)}`);
  const mode = $('shipMode');
  lines.push(mode.value === 'none' ? 'Shipping: excluded' : `Shipping (${mode.selectedOptions[0].textContent}): ${fmt($('shipping').value)}`);
  lines.push(`Total (USD): ${$('rTotal').textContent}`);
  if (mode.value !== 'none') lines.push('Shipping is subject to confirmation.');
  try {
    await navigator.clipboard.writeText(lines.join('\n'));
    $('copyStatus').textContent = '报价摘要已复制。';
  } catch {
    $('copyStatus').textContent = '复制失败，请检查浏览器剪贴板权限。';
  }
};

function updateDbWeightEstimate() {
  const output = $('dbWeightEstimate');
  const product = PRODUCTS.find(entry => entry.id === $('weightProduct').value);
  const dimension = $('weightSize').value.trim();
  const count = Number($('weightQty').value);
  if (!product || !dimension || !Number.isSafeInteger(count) || count < 1) {
    output.textContent = '选择品类，填写尺寸和正整数数量后查看重量。';
    return;
  }
  const sizes = matchingWeightSizes(product, dimension);
  if (sizes.length > 1) {
    output.textContent = '该尺寸有多种款式，请从建议列表选择完整规格。';
    return;
  }
  const estimate = sizes.length ? estimateCatalogWeight(product, sizes[0], count) : null;
  output.textContent = estimate
    ? `参考整批重量 ${weightKg(estimate.kg)} kg · ${estimate.detail}`
    : '报价库里没有该规格的可用重量记录，可用实际称重核算。';
}

function buildDb(){
  const names=['全部',...new Set(DB_ROWS.map(r=>r.Product))];
  $('dbProduct').innerHTML=names.map(n=>`<option>${n}</option>`).join('');
  $('dbProduct').onchange=renderDb; $('dbSearch').oninput=renderDb;
  const productInput = $('weightProduct');
  productInput.replaceChildren(...PRODUCTS.map(product => new Option(product.name, product.id)));
  function updateSizeOptions() {
    const product = PRODUCTS.find(entry => entry.id === productInput.value);
    $('weightSize').value = '';
    $('weightSizeOptions').replaceChildren(...product.sizes.map(spec => new Option(spec.label, spec.label)));
    updateDbWeightEstimate();
  }
  productInput.addEventListener('change', updateSizeOptions);
  $('weightSize').addEventListener('input', updateDbWeightEstimate);
  $('weightQty').addEventListener('input', updateDbWeightEstimate);
  updateSizeOptions();
  renderDb();
}
function renderDb(){
  const prod=$('dbProduct').value, q=$('dbSearch').value.trim().toLowerCase();
  const rows=DB_ROWS.filter(r=>(prod==='全部'||r.Product===prod)&&(!q||[r.Type,r.cm,r.inch,r.app,r.notes].join(' ').toLowerCase().includes(q)));
  $('dbCount').textContent=`显示 ${rows.length} 条记录`;
  const head=['Product','Type','Size cm','Qty','Batch Min','Batch Max','Unit Min','Unit Max','Source','Weight','Air','Sea','MOQ','Notes'];
  $('dbTable').innerHTML='<thead><tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+[
      r.Product,r.Type,r.cm,r.qty,r.bmin,r.bmax,r.umin,r.umax,r.src,r.weight,r.air,r.sea,r.moq,r.notes
    ].map(v=>`<td>${v??''}</td>`).join('')+'</tr>').join('')+'</tbody>';
}

buildProducts(); buildDb(); renderCart();
</script>
</body>
</html>
