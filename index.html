<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多产品报价计算器 · Custom Packaging</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--green:#16a34a;--danger:#dc2626;--navy:#17365d;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px} h1{font-size:22px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:minmax(330px,.9fr) minmax(430px,1.35fr);gap:16px} @media(max-width:850px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)} .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:700;letter-spacing:.4px}
label{display:block;font-size:13px;font-weight:600;margin:11px 0 4px} select,input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.row{display:flex;gap:10px} .row>div{flex:1} .hint{font-size:12px;color:var(--muted);margin-top:6px} .badge{display:inline-block;padding:2px 8px;border-radius:20px;background:#eef2ff;color:#3730a3;font-size:11px}
.addon{margin:6px 0;font-size:13px} .addon label{display:flex;align-items:center;gap:8px;font-weight:500;margin:0} .addon input{width:auto}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer} .btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:14px} .btn-danger{background:#fee2e2;color:#991b1b;padding:6px 9px} .btn-ghost{background:#eef2ff;color:#1e40af}
.summary{background:linear-gradient(135deg,#17365d,#2563eb);color:white;border:none} .summary h2{color:#dbeafe}
.line{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.18);font-size:14px} .line:last-child{border:0} .total{font-size:25px;font-weight:800} .total .v{color:#fbbf24}
.items{width:100%;border-collapse:collapse;font-size:12.5px} .items th{text-align:left;background:#f8fafc;padding:8px;border-bottom:1px solid var(--line)} .items td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top} .items .money{text-align:right;white-space:nowrap}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px}
.shipbox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)} .warn{font-size:12px;color:#b45309;margin-top:8px}
.dbwrap{margin-top:16px} #dbTable{width:100%;border-collapse:collapse;font-size:12px} #dbTable th{position:sticky;top:0;background:#17365d;color:#fff;padding:7px 8px;text-align:left;white-space:nowrap} #dbTable td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap} #dbTable tr:nth-child(even) td{background:#fafbfc}
.smallrule{color:#1d4ed8;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>多产品报价计算器 · 定制包装</h1>
  <p class="sub">数据库来源：1quotation-database-paperbag-mailer-lowqty.xlsx · 一张报价单可同时添加多个产品</p>

  <div class="grid">
    <div>
      <div class="card">
        <h2>① 添加产品</h2>
        <label>产品品类</label><select id="product"></select>
        <label>尺寸 / 规格</label><select id="size"></select>
        <div class="hint" id="sizeHint"></div>
        <label>数量</label><div id="qtyWrap"></div>
        <div class="hint" id="priceHint"></div>
        <div id="addonsBox" style="margin-top:12px"></div>
        <button class="btn btn-primary" id="addBtn">＋ Add Product / 添加到报价单</button>
      </div>

      <div class="card shipbox">
        <h2>② 整单运费</h2>
        <div class="hint">多产品不分别累加各产品运费；先合并可用重量，再统一估算一次运费。</div>
        <div class="row">
          <div><label>运输方式</label>
            <select id="shipMode">
              <option value="none">暂不计运费</option>
              <option value="air">空运估算</option>
              <option value="sea">海运估算</option>
              <option value="manual">手动输入</option>
            </select>
          </div>
          <div><label>运费 USD</label><input type="number" id="shipping" min="0" step="0.01" value="0"></div>
        </div>
        <div class="hint" id="weightInfo">当前整单重量：0 kg</div>
        <div class="warn" id="weightWarn"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>③ 当前报价单产品</h2>
        <div id="cartEmpty" class="empty">还没有产品，左侧选择产品后点击“添加到报价单”。</div>
        <div style="overflow:auto"><table class="items" id="cartTable" style="display:none">
          <thead><tr><th>#</th><th>产品</th><th>规格</th><th>Qty</th><th class="money">货值</th><th class="money">工艺</th><th></th></tr></thead>
          <tbody id="cartBody"></tbody>
        </table></div>
      </div>

      <div class="card summary" style="margin-top:16px">
        <h2>报价汇总</h2>
        <div class="line"><span>产品种类</span><span class="v" id="rCount">0</span></div>
        <div class="line"><span>产品货值</span><span class="v" id="rItems">$0.00</span></div>
        <div class="line"><span>工艺附加费</span><span class="v" id="rAddons">$0.00</span></div>
        <div class="line"><span>整单运费</span><span class="v" id="rShipping">$0.00</span></div>
        <div class="line total"><span>Total</span><span class="v" id="rTotal">$0.00</span></div>
      </div>
    </div>
  </div>

  <div class="card dbwrap">
    <h2>📋 完整报价数据库</h2>
    <div class="row">
      <div><label>筛选品类</label><select id="dbProduct"></select></div>
      <div><label>搜索尺寸 / 袋型 / 用途</label><input id="dbSearch" type="text" placeholder="如 25×20×7 / 横版 / T恤"></div>
    </div>
    <div class="hint" id="dbCount" style="margin:8px 0"></div>
    <div style="overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px"><table id="dbTable"></table></div>
  </div>
</div>

const FREIGHT_MODEL = {air:10.65, seaBase:32.27, seaKg:2.04};
let cart = [];
const $ = id => document.getElementById(id);
const fmt = n => '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

function parseWeight(text, qty){
  if(!text) return null;
  const m = String(text).match(/([0-9.]+)kg(?:\/([0-9.]+)pcs)?/i);
  if(!m) return null;
  const kg = parseFloat(m[1]);
  const baseQty = m[2] ? parseFloat(m[2]) : qty;
  if(!baseQty || !qty) return kg;
  return kg/baseQty*qty;
}

function currentProduct(){ return PRODUCTS.find(p=>p.id===$('product').value); }
function currentSize(){
  const p=currentProduct(); return p ? p.sizes[parseInt($('size').value)||0] : null;
}

function buildProducts(){
  $('product').innerHTML = PRODUCTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  $('product').onchange=buildSizes;
  buildSizes();
}

function buildSizes(){
  const p=currentProduct();
  $('size').innerHTML=p.sizes.map((s,i)=>`<option value="${i}">${s.label}</option>`).join('');
  $('size').onchange=buildQty;
  buildQty();
}

function buildQty(){
  const s=currentSize(), p=currentProduct();
  $('sizeHint').textContent = [s.application,s.dim,s.notes].filter(Boolean).join(' · ');
  if(s.mode==='unit'){
    $('qtyWrap').innerHTML=`<input type="number" id="qty" min="${s.moq||1}" step="1" value="${s.moq||1}">`;
    $('qty').oninput=previewPrice;
  } else {
    const valid=s.tiers.filter(t=>Number.isFinite(t.bmin));
    $('qtyWrap').innerHTML=`<select id="qty">${valid.map(t=>`<option value="${t.qty}">${t.qty} pcs${t.src==='SmallQtyRule'?' · 小批量':''}</option>`).join('')}</select>`;
    $('qty').onchange=previewPrice;
  }
  buildAddons();
  previewPrice();
}

function buildAddons(){
  const p=currentProduct();
  if(!p.addons.length){ $('addonsBox').innerHTML=''; return; }
  $('addonsBox').innerHTML='<label>工艺附加费</label>'+p.addons.map((a,i)=>`
    <div class="addon"><label><input type="checkbox" class="addonCheck" data-i="${i}"> ${a.label} ${a.quote?'（需单独报价）':a.perUnit?'(+$'+a.price+'/pc)':'(+$'+a.price+')'}</label></div>`).join('');
  document.querySelectorAll('.addonCheck').forEach(x=>x.onchange=previewPrice);
}

function getSelection(){
  const p=currentProduct(), s=currentSize();
  if(!p||!s) return null;
  const qty=parseInt($('qty').value)||0;
  let bmin=0,bmax=0,src='',rowWeight=null,notes='';
  if(s.mode==='unit'){
    bmin=(s.unitMin||0)*qty; bmax=(s.unitMax||s.unitMin||0)*qty; src='Original';
  } else {
    const t=s.tiers.find(x=>x.qty===qty);
    if(!t) return null;
    bmin=t.bmin; bmax=t.bmax; src=t.src; rowWeight=t.weight; notes=t.notes;
  }
  const price=(bmin+bmax)/2;
  const addonChecks=[...document.querySelectorAll('.addonCheck:checked')];
  let addon=0, quoteAddons=[];
  addonChecks.forEach(c=>{
    const a=p.addons[parseInt(c.dataset.i)];
    if(a.quote) quoteAddons.push(a.label); else addon+=Number(a.price||0)*(a.perUnit?qty:1);
  });
  let weight=parseWeight(rowWeight,qty);
  if(weight==null){
    for(const w of s.weights){
      if(typeof w.qty==='number'){
        const pw=parseWeight(w.weight,Number(w.qty));
        if(pw!=null){ weight=pw/Number(w.qty)*qty; break; }
      } else {
        const pw=parseWeight(w.weight,qty);
        if(pw!=null){ weight=pw; break; }
      }
    }
  }
  return {productId:p.id,product:p.name,size:s.label,qty,bmin,bmax,price,addon,quoteAddons,src,weight,notes};
}

function previewPrice(){
  const x=getSelection();
  if(!x) return;
  const range=x.bmin!==x.bmax?` · 区间 ${fmt(x.bmin)}–${fmt(x.bmax)}，当前取中值`:'';
  const source=x.src==='SmallQtyRule'?' · 小批量规则':'';
  $('priceHint').textContent=`货值 ${fmt(x.price)} · 单价 ${(x.price/x.qty).toFixed(3)}${range}${source}`;
}

$('addBtn').onclick=()=>{
  const x=getSelection(); if(!x) return;
  cart.push(x); renderCart();
};

function renderCart(){
  $('cartEmpty').style.display=cart.length?'none':'block';
  $('cartTable').style.display=cart.length?'table':'none';
  $('cartBody').innerHTML=cart.map((x,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${x.product}${x.src==='SmallQtyRule'?'<div class="smallrule">SmallQtyRule</div>':''}</td>
      <td>${x.size}${x.quoteAddons.length?'<div class="hint">需另报：'+x.quoteAddons.join(' / ')+'</div>':''}</td>
      <td>${x.qty}</td>
      <td class="money">${fmt(x.price)}</td>
      <td class="money">${fmt(x.addon)}</td>
      <td><button class="btn btn-danger" onclick="removeItem(${i})">删除</button></td>
    </tr>`).join('');
  updateSummary();
}

function removeItem(i){ cart.splice(i,1); renderCart(); }

function orderWeight(){
  let total=0, missing=0;
  cart.forEach(x=>{ if(Number.isFinite(x.weight)) total+=x.weight; else missing++; });
  return {total:Math.round(total*10)/10,missing};
}
function shipEstimate(mode,w){
  if(mode==='air') return Math.round(FREIGHT_MODEL.air*w);
  if(mode==='sea') return Math.round(FREIGHT_MODEL.seaBase+FREIGHT_MODEL.seaKg*w);
  return 0;
}
function updateShipping(){
  const w=orderWeight();
  $('weightInfo').textContent=`当前可计算整单重量：${w.total} kg`;
  $('weightWarn').textContent=w.missing?`有 ${w.missing} 个产品缺少重量数据，自动运费仅供参考，建议手动确认。`:'';
  const mode=$('shipMode').value;
  if(mode==='air'||mode==='sea') $('shipping').value=shipEstimate(mode,w.total);
  else if(mode==='none') $('shipping').value=0;
  $('shipping').readOnly=(mode!=='manual');
}
$('shipMode').onchange=()=>{updateShipping();updateSummary();};
$('shipping').oninput=updateSummary;

function updateSummary(){
  updateShipping();
  const items=cart.reduce((s,x)=>s+x.price,0);
  const addons=cart.reduce((s,x)=>s+x.addon,0);
  const shipping=parseFloat($('shipping').value)||0;
  $('rCount').textContent=cart.length;
  $('rItems').textContent=fmt(items);
  $('rAddons').textContent=fmt(addons);
  $('rShipping').textContent=fmt(shipping);
  $('rTotal').textContent=fmt(items+addons+shipping);
}

function buildDb(){
  const names=['全部',...new Set(DB_ROWS.map(r=>r.Product))];
  $('dbProduct').innerHTML=names.map(n=>`<option>${n}</option>`).join('');
  $('dbProduct').onchange=renderDb; $('dbSearch').oninput=renderDb;
  renderDb();
}
function renderDb(){
  const prod=$('dbProduct').value, q=$('dbSearch').value.trim().toLowerCase();
  const rows=DB_ROWS.filter(r=>(prod==='全部'||r.Product===prod)&&(!q||[r.Type,r.cm,r.inch,r.app,r.notes].join(' ').toLowerCase().includes(q)));
  $('dbCount').textContent=`显示 ${rows.length} 条记录`;
  const head=['Product','Type','Size cm','Qty','Batch Min','Batch Max','Unit Min','Unit Max','Source','Weight','Air','Sea','MOQ','Notes'];
  $('dbTable').innerHTML='<thead><tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+[
      r.Product,r.Type,r.cm,r.qty,r.bmin,r.bmax,r.umin,r.umax,r.src,r.weight,r.air,r.sea,r.moq,r.notes
    ].map(v=>`<td>${v??''}</td>`).join('')+'</tr>').join('')+'</tbody>';
}

buildProducts(); buildDb(); renderCart();
</script>
</body>
</html>
