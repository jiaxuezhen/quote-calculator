<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报价计算器 · 手机版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f3f5;color:#1f2937}
.app{max-width:520px;margin:0 auto;padding-bottom:90px}
header{background:#1e3a5f;color:#fff;padding:14px 16px;font-size:18px;font-weight:700;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.card{background:#fff;margin:10px 12px;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:14px;color:#6b7280;margin:0 0 12px;font-weight:600}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin:12px 0 5px}
select,input[type=number],input[type=text]{width:100%;height:46px;padding:0 12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
.hint{font-size:12px;color:#9ca3af;margin-top:6px;line-height:1.5}
.addon{margin:8px 0}
.addon label{display:flex;align-items:center;gap:10px;font-weight:500;margin:0;font-size:15px;min-height:40px}
.addon input{width:22px;height:22px;flex:none}
.row{display:flex;gap:10px}.row>div{flex:1}
.result-bar{position:fixed;bottom:0;left:0;right:0;background:#1e3a5f;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -2px 10px rgba(0,0,0,.18);z-index:20}
.result-bar .label{font-size:13px;color:#cbd5e1}
.result-bar .total{font-size:26px;font-weight:800;color:#fbbf24;line-height:1.1}
.result-bar button{background:#fbbf24;color:#1e3a5f;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;min-height:44px}
.result-detail{display:none;background:#fff;margin:10px 12px;border-radius:14px;padding:16px;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.result-detail .line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #e5e7eb}
.result-detail .line span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
details{margin:10px 12px}
details summary{background:#fff;border-radius:14px;padding:14px 16px;font-weight:600;color:#1e3a5f;list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary:after{content:'▾';float:right;color:#9ca3af}
details[open] summary:after{content:'▴'}
.dbinner{padding:12px}
.dbwrap{overflow:auto;background:#fff;border-radius:12px}
table#dbTable{width:100%;border-collapse:collapse;font-size:12px}
#dbTable th{position:sticky;top:0;background:#1e3a5f;color:#fff;padding:8px;text-align:left;white-space:nowrap}
#dbTable td{padding:7px 8px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
#dbTable tr:nth-child(even) td{background:#fafbfc}
#dbTable td.ref{color:#d97706;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header>报价计算器</header>

  <div class="card">
    <h2>① 产品 & 规格</h2>
    <label>产品品类</label>
    <select id="product"></select>
    <label>尺寸</label>
    <select id="size"></select>
    <div class="hint" id="sizeHint"></div>
    <label id="qtyLabel">数量</label>
    <select id="qty"></select>
    <div class="hint" id="moqHint"></div>
  </div>

  <div class="card">
    <h2>② 工艺附加费</h2>
    <div id="addons"></div>
  </div>

  <div class="card">
    <h2>③ 运费</h2>
    <label>当前规格运费规则</label>
    <select id="freightMode"><option value="manual">暂不计运费 / 手动输入</option></select>
    <div class="hint" id="freightMatch">No exact freight record — manual quotation required</div>
    <label>运费金额 (USD)</label>
    <input type="number" id="freight" min="0" step="0.01" placeholder="0" value="0" inputmode="decimal">
    <div id="manualCalcBox" style="display:none;margin-top:8px">
      <div class="row">
        <div><label>重量 (kg)</label><input type="number" id="manualWeight" min="0.1" step="0.1" placeholder="重量" inputmode="decimal"></div>
        <div><label>运输方式</label><select id="manualMethod"><option value="air">空运</option><option value="sea">海运</option></select></div>
      </div>
      <div class="hint" id="manualCalcResult"></div>
    </div>
    <div class="hint">运费仍可手动修改。实际成交前建议按目的国、体积重和当日渠道再次确认。</div>
  </div>

  <details>
    <summary>📋 完整报价数据库</summary>
    <div class="dbinner">
      <label>筛选品类</label>
      <select id="dbProduct"></select>
      <label>搜索（尺寸/袋型/用途）</label>
      <input type="text" id="dbSearch" placeholder="如 25×20×7 / 冲孔 / T恤">
      <div class="hint" id="dbCount"></div>
      <div class="dbwrap"><table id="dbTable" cellspacing="0"></table></div>
    </div>
  </details>

  <div class="result-bar">
    <div><div class="label">合计 Total</div><div class="total" id="rTotal">$0.00</div></div>
    <button onclick="toggleDetail()">明细</button>
  </div>
</div>

<div class="result-detail" id="resultDetail">
  <div class="line"><span>数量</span><span id="rQty">-</span></div>
  <div class="line"><span>基础价（货值）</span><span id="rItems">$0.00</span></div>
  <div class="line"><span>单价</span><span id="rUnit">$0.000 / 个</span></div>
  <div class="line"><span>工艺附加费</span><span id="rAddon">$0.00</span></div>
  <div class="line"><span>运费</span><span id="rFreight">$0.00</span></div>
  <div class="hint" id="rNote"></div>
</div>

const $ = id => document.getElementById(id);
const fmt = n => '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});

function buildProductSelect(){
  const sel = $('product');
  sel.innerHTML = PRODUCTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  sel.onchange = onProduct;
  onProduct();
}

function onProduct(){
  curProduct = PRODUCTS.find(p=>p.id === $('product').value);
  // size
  const ss = $('size');
  ss.innerHTML = curProduct.sizes.map((s,i)=>`<option value="${i}">${s.label}</option>`).join('');
  $('sizeHint').textContent = curProduct.note || '';
  // qty
  const qs = $('qty');
  if(curProduct.mode === 'unit'){
    $('qtyLabel').textContent = '数量 (输入，MOQ ' + curProduct.moq + ')';
    qs.outerHTML = '<input type="number" id="qty" min="'+curProduct.moq+'" step="1" value="'+curProduct.moq+'">';
    $('qty').oninput = rebuildFreight;
  }else{
    $('qtyLabel').textContent = '数量 (MOQ ' + curProduct.moq + ')';
    qs.outerHTML = '<select id="qty"></select>';
    const first = curProduct.sizes[0];
    const tiers = curProduct.mode==='tier' ? Object.keys(first.p).map(Number).sort((a,b)=>a-b) : Object.keys(first.p).map(Number).sort((a,b)=>a-b);
    $('qty').innerHTML = tiers.map(t=>`<option value="${t}">${t} pcs</option>`).join('');
    $('qty').onchange = rebuildFreight;
  }
  $('moqHint').textContent = 'MOQ: ' + curProduct.moq + ' ' + curProduct.unit + '（低于MOQ单价会上浮）';
  // addons
  const ad = $('addons');
  ad.innerHTML = curProduct.addons.map(a=>{
    const priceTxt = a.per ? ('（'+a.per+'）') : ('+$'+a.price);
    return `<div class="addon"><label><input type="checkbox" data-price="${a.price||0}" data-per="${a.per?1:0}"> ${a.label} ${priceTxt}</label></div>`;
  }).join('');
  Array.from(ad.querySelectorAll('input')).forEach(c=>c.onchange=calc);
  ss.onchange = ()=>{ curSize=+ss.value; rebuildFreight(); };
  curSize = 0;
  rebuildFreight();
}

function getPrice(sizeObj, qty){
  if(curProduct.mode === 'unit'){
    return sizeObj.u * qty;
  }
  if(curProduct.mode === 'range'){
    const r = sizeObj.p[qty];
    return (r[0]+r[1])/2; // 取中值
  }
  return sizeObj.p[qty] || null;
}

// 结构：productId -> 尺寸(cm) -> 数量 -> { w:重量kg, air:空运$, sea:海运$ }
// 以后新增真实运费，只需往这里加，不动报价核心代码。
const FREIGHT_RULES = {
  paper_bag: {
    "16×7×13": {"50":{w:4,air:38,sea:null},"100":{w:6,air:62,sea:null},"200":{w:12,air:128,sea:42},"500":{w:30,air:328,sea:92},"1000":{w:60,air:null,sea:172}},
    "23×10×18": {"50":{w:4,air:46,sea:null},"100":{w:8,air:86,sea:null},"200":{w:16,air:176,sea:52},"500":{w:40,air:null,sea:120},"1000":{w:80,air:null,sea:206}},
    "27×8×21": {"50":{w:5,air:56,sea:null},"100":{w:10,air:108,sea:null},"200":{w:20,air:216,sea:66},"500":{w:50,air:null,sea:139},"1000":{w:100,air:null,sea:242}},
    "32×11.5×26": {"50":{w:6.5,air:69,sea:null},"100":{w:13,air:142,sea:null},"200":{w:26,air:null,sea:82},"500":{w:65,air:null,sea:179},"1000":{w:130,air:null,sea:298}},
    "42×14×32": {"50":{w:9.5,air:99,sea:null},"100":{w:19,air:null,sea:58},"200":{w:38,air:null,sea:118},"500":{w:95,air:null,sea:232},"1000":{w:190,air:null,sea:397}},
  },
  magnetic_box: {
    "29×21×7.5": {"30":{w:15,air:152,sea:52},"50":{w:22,air:232,sea:76},"100":{w:44,air:462,sea:136}},
  },
};

function deriveAir(w){ return Math.round(FREIGHT_MODEL.air * w); }
function deriveSea(w){ return Math.round(FREIGHT_MODEL.seaBase + FREIGHT_MODEL.seaKg * w); }

// 匹配优先级：真实历史运费 > 规则估算(perPieceW × 模型) > 无（手动）
function lookupFreight(productId, size, qty){
  const rule = size.cm && FREIGHT_RULES[productId] && FREIGHT_RULES[productId][size.cm];
  if(rule && rule[qty]){
    const f = rule[qty];
    return { w: f.w, air: f.air, sea: f.sea, source: 'actual' };
  }
  if(size.perPieceW){
    const w = Math.round(size.perPieceW * qty * 10) / 10;
    return { w: w, air: deriveAir(w), sea: deriveSea(w), source: 'estimate' };
  }
  return null;
}
function calc(){
  if(!curProduct) return;
  curSize = curSize == null ? 0 : curSize;
  const size = curProduct.sizes[curSize];
  let items = 0, unit = 0, note='', rangeTxt='';
  if(curProduct.mode === 'unit'){
    curQty = parseInt($('qty').value)||curProduct.moq;
    items = size.u * curQty;
    unit = size.u;
  }else{
    curQty = parseInt($('qty').value);
    if(curProduct.mode === 'range'){
      const r = size.p[curQty];
      items = (r[0]+r[1])/2;
      unit = items/curQty;
      rangeTxt = `（区间 $${r[0]}–$${r[1]}）`;
    }else{
      items = size.p[curQty];
      unit = items/curQty;
    }
  }
  let addon = 0;
  document.querySelectorAll('#addons input:checked').forEach(c=>{
    const per = c.dataset.per==='1';
    if(per){ note += '；含需单独报价的工艺项'; }
    else { addon += parseFloat(c.dataset.price||0); }
  });
  $('rQty').textContent = curQty + ' ' + curProduct.unit;
  $('rItems').textContent = fmt(items) + (rangeTxt?('  '+rangeTxt):'');
  $('rUnit').textContent = '$' + unit.toFixed(3) + ' / ' + curProduct.unit;
  $('rAddon').textContent = fmt(addon);
  const freight = parseFloat($('freight').value)||0;
  const total = items + addon + freight;
  $('rFreight').textContent = fmt(freight);
  $('rTotal').textContent = fmt(total);
  $('rNote').textContent = note;
}

// 根据下拉（manual/air/sea）自动填运费金额
function applyFreightMode(){
  if(!curProduct) return;
  const mode = $('freightMode').value;
  const mcb = $('manualCalcBox');
  if(mode === 'manualCalc'){
    mcb.style.display = '';
    updateManualCalc();
    return;
  }
  mcb.style.display = 'none';
  const size = curProduct.sizes[curSize];
  const fr = lookupFreight(curProduct.id, size, curQty);
  if(mode === 'air' && fr && fr.air != null) $('freight').value = fr.air;
  else if(mode === 'sea' && fr && fr.sea != null) $('freight').value = fr.sea;
}

function calcManualAir(w){ return w <= 0.5 ? 20 : 20 + 6 * Math.ceil((w - 0.5) / 0.5); }
function calcManualSea(w){ return w <= 12 ? 45 : 45 + 3 * Math.ceil(w - 12); }

function updateManualCalc(){
  const w = parseFloat($('manualWeight').value)||0;
  const method = $('manualMethod').value;
  if(w <= 0){ $('manualCalcResult').textContent = '空运：0.5kg=$20，超出每0.5kg+$6；海运：12kg=$45，超出每1kg+$3'; return; }
  const air = calcManualAir(w);
  const sea = calcManualSea(w);
  const val = method === 'air' ? air : sea;
  $('manualCalcResult').textContent = w+'kg → 空运 $'+air+' · 海运 $'+sea+'（当前用'+(method==='air'?'空运':'海运')+': $'+val+'）';
  $('freight').value = val;
}

// 产品/尺寸/数量变化时：重建下拉 + 匹配提示 + 自动填运费
function rebuildFreight(){
  if(!curProduct) return;
  const size = curProduct.sizes[curSize];
  curQty = curProduct.mode === 'unit' ? (parseInt($('qty').value)||curProduct.moq) : parseInt($('qty').value);
  const fr = lookupFreight(curProduct.id, size, curQty);
  const modeSel = $('freightMode');
  const prev = modeSel.value;
  let opts = '<option value="manual">暂不计运费 / 手动输入</option>';
  opts += '<option value="manualCalc">手动计算（按重量）</option>';
  if(fr && fr.air != null) opts += '<option value="air">空运</option>';
  if(fr && fr.sea != null) opts += '<option value="sea">海运</option>';
  modeSel.innerHTML = opts;
  if([...modeSel.options].some(o=>o.value===prev)) modeSel.value = prev;
  const match = $('freightMatch');
  if(fr){
    let m = [];
    if(fr.air != null) m.push('空运 $'+fr.air);
    if(fr.sea != null) m.push('海运 $'+fr.sea);
    const mt = m.join('；');
    if(fr.source==='actual'){
      match.textContent = '已匹配实际运费：'+fr.w+'kg'+(mt?('；'+mt):'')+'。实际记录优先于按公斤估算。';
    }else{
      match.textContent = '规则估算运费：'+fr.w+'kg'+(mt?('；'+mt):'')+'。';
    }
  }else{
    match.textContent = 'No exact freight record — manual quotation required';
  }
  applyFreightMode();
  calc();
}

// init
buildProductSelect();
$('freight').oninput = calc;
$('freightMode').onchange = function(){ applyFreightMode(); calc(); };
$('manualWeight').oninput = function(){ updateManualCalc(); calc(); };
$('manualMethod').onchange = function(){ updateManualCalc(); calc(); };

function dbPrice(r){
  if(r.ptype==='Unit') return '—';
  if(r.bmin==null) return '—';
  if(r.ptype==='Range') return '$'+r.bmin+'–$'+r.bmax;
  return '$'+r.bmin;
}
function dbUnit(r){
  if(r.umin==null) return '—';
  return (r.umin===r.umax) ? '$'+r.umin.toFixed(2) : '$'+r.umin.toFixed(2)+'–$'+r.umax.toFixed(2);
}
function renderDB(){
  const prod = $('dbProduct').value;
  const q = ($('dbSearch').value||'').trim().toLowerCase();
  const filtered = DB_ROWS.filter(r=>{
    if(prod && r.Product!==prod) return false;
    if(!q) return true;
    return [r.Product,r.Type,r.cm,r.inch,r.app,r.src,r.weight].join(' ').toLowerCase().includes(q);
  });
  $('dbCount').textContent = '共 ' + filtered.length + ' 条（总计 ' + DB_ROWS.length + ' 条）';
  let h = '<thead><tr><th>品类</th><th>袋型/方向</th><th>尺寸</th><th>数量</th><th>计价</th><th>整批价</th><th>单个价</th><th>来源</th><th>重量</th><th>空运</th><th>海运</th><th>用途</th><th>MOQ</th></tr></thead><tbody>';
  for(const r of filtered){
    const src = r.src==='Reference' ? ('参考'+(r.ref?('→'+r.ref):'')) : '原价';
    const qty = r.qty==='per pc' ? '按个' : r.qty;
    const size = r.inch ? (r.cm + ' / ' + r.inch) : r.cm;
    h += '<tr>'
      + '<td>'+r.Product+'</td>'
      + '<td>'+(r.Type||'')+'</td>'
      + '<td>'+size+'</td>'
      + '<td>'+qty+'</td>'
      + '<td>'+r.ptype+'</td>'
      + '<td>'+dbPrice(r)+'</td>'
      + '<td>'+dbUnit(r)+'</td>'
      + '<td class="'+(r.src==='Reference'?'ref':'')+'">'+src+'</td>'
      + '<td>'+(r.weight||'')+'</td>'
      + '<td>'+(r.air!=null?('$'+r.air):'')+'</td>'
      + '<td>'+(r.sea!=null?('$'+r.sea):'')+'</td>'
      + '<td>'+(r.app||'')+'</td>'
      + '<td>'+r.moq+'</td>'
      + '</tr>';
  }
  h += '</tbody>';
  $('dbTable').innerHTML = h;
}

const prodSel = $('dbProduct');
prodSel.innerHTML = '<option value="">全部品类</option>' + [...new Set(DB_ROWS.map(r=>r.Product))].map(p=>`<option>${p}</option>`).join('');
prodSel.onchange = renderDB;
$('dbSearch').oninput = renderDB;
renderDB();
